<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=index.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to OpenMFM deck</title>
  <link rel="canonical" href="https://openmfm.org/decks/fetal-bradycardia-6-weeks/index.html" />
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.92);
      --border: rgba(34, 211, 238, 0.32);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 40%),
        linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    window.location.replace("index.html");
  </script>
</head>
<body>
  <main>
    <div class="eyebrow">OpenMFM</div>
    <h1>Opening the canonical fetal heart rate deck</h1>
    <p>
      This filename now points to the OpenMFM production deck for fetal bradycardia counseling at 6 weeks.
      If the redirect does not happen automatically, <a href="index.html">open the deck here</a>.
    </p>
  </main>
</body>
</html>
